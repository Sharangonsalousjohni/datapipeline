version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frie-backend
    ports:
      - "8000:8000"
    environment:
      - FRIE_DATA_DIR=/app/data
      - FRIE_EMBEDDING_PROVIDER=sentence-transformers
      - FRIE_OCR_PROVIDER=rapidocr
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frie-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
